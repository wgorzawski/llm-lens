name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Wipe demo database (the API re-seeds it on startup)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Mikrus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── build shared packages ─────────────────────────────────────────────
      - name: Build shared packages
        run: |
          pnpm --filter @llm-lens/types build
          pnpm --filter @llm-lens/parsers build
          pnpm --filter @llm-lens/instrument build

      # ── build API ──────────────────────────────────────────────────────
      - name: Build API
        run: pnpm --filter @llm-lens/api build

      # ── build Nuxt on CI (memory-heavy — server has only 1 GB) ───────────
      - name: Build web
        run: pnpm --filter @llm-lens/web build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.DEMO_NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_DEMO_MODE: "true"
          NODE_OPTIONS: "--max-old-space-size=6144"

      # ── set up SSH ────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/demo_key
          chmod 600 ~/.ssh/demo_key
          ssh-keyscan -p ${{ secrets.DEMO_SSH_PORT }} ${{ secrets.DEMO_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Define SSH alias
        run: |
          echo "SSH_CMD=ssh -i ~/.ssh/demo_key -p ${{ secrets.DEMO_SSH_PORT }} ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}" >> $GITHUB_ENV
          echo "RSYNC_SSH=ssh -i ~/.ssh/demo_key -p ${{ secrets.DEMO_SSH_PORT }}" >> $GITHUB_ENV

      # ── create .env files from secrets, at fixed paths OUTSIDE apps/packages ──
      # deploy.sh wipes and re-extracts apps/ + packages/ on every deploy (tar+scp
      # pattern shared with xposter/fudini), so a .env dropped directly at
      # apps/api/.env or apps/web/.env wouldn't survive the next deploy. These fixed
      # paths live at the deploy dir root instead; deploy.sh copies them into place
      # itself, after extraction.
      - name: Create .env files on server
        run: |
          cat > /tmp/api.env << EOF
          JWT_SECRET=${{ secrets.DEMO_JWT_SECRET }}
          DATABASE_URL=file:/home/mikrus/llm-lens-prod/data/demo.db
          UPLOADS_DIR=/home/mikrus/llm-lens-prod/data/uploads
          DEMO_MODE=true
          PORT=3032
          API_URL=http://localhost:3032
          FRONTEND_URL=http://localhost:3031
          EOF

          printf 'PORT=3031\n' > /tmp/web.env

          rsync -az -e "$RSYNC_SSH" /tmp/api.env \
            ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}:/home/mikrus/llm-lens-prod/.env.llm-lens-api

          rsync -az -e "$RSYNC_SSH" /tmp/web.env \
            ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}:/home/mikrus/llm-lens-prod/.env.llm-lens-web

      # ── archive build ────────────────────────────────────────────────────
      - name: Archive build
        run: |
          tar czf repo.tar.gz \
            apps \
            packages \
            deploy.sh \
            ecosystem.config.cjs \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            .nvmrc

      - name: Upload archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          port: ${{ secrets.DEMO_SSH_PORT }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          source: "repo.tar.gz"
          target: "/home/mikrus/llm-lens-prod"

      # ── extract & run deploy.sh ────────────────────────────────────────
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          port: ${{ secrets.DEMO_SSH_PORT }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            DEPLOY_DIR=/home/mikrus/llm-lens-prod

            # Baza i uploady żyją w $DEPLOY_DIR/data, POZA apps/ - apps/ jest
            # kasowane przy każdym deployu, a wcześniej leżała tam demo.db, więc
            # każdy deploy bez seed=true zostawiał puste demo. Jednorazowa
            # migracja: przenieś starą bazę, jeśli jeszcze tu jest.
            mkdir -p $DEPLOY_DIR/data/uploads
            if [ -f $DEPLOY_DIR/apps/api/demo.db ] && [ ! -f $DEPLOY_DIR/data/demo.db ]; then
              echo "→ migrating demo.db to $DEPLOY_DIR/data"
              for f in $DEPLOY_DIR/apps/api/demo.db*; do mv "$f" $DEPLOY_DIR/data/; done
            fi
            if [ -d $DEPLOY_DIR/apps/api/uploads ]; then
              cp -rn $DEPLOY_DIR/apps/api/uploads/. $DEPLOY_DIR/data/uploads/ 2>/dev/null || true
            fi

            # Wyczyść stare apps/packages przed rozpakowaniem (tar nie usuwa
            # plików, których nie ma w nowym archiwum).
            rm -rf $DEPLOY_DIR/apps $DEPLOY_DIR/packages

            tar xzf $DEPLOY_DIR/repo.tar.gz -C $DEPLOY_DIR
            rm $DEPLOY_DIR/repo.tar.gz
            chmod +x $DEPLOY_DIR/deploy.sh
            cd $DEPLOY_DIR
            ./deploy.sh

      # ── verify demo data ──────────────────────────────────────────────────
      # The API seeds and repairs the demo account by itself in DEMO_MODE (at startup
      # and hourly - see apps/api/src/services/demo-maintenance.ts). seed=true only
      # wipes the database first; this step then waits until the demo login works and
      # has data, so a broken demo fails the deploy instead of going unnoticed.
      - name: Verify demo data
        run: |
          $SSH_CMD bash -s << 'ENDSSH'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/mikrus/llm-lens-prod
            if [ "${{ inputs.seed }}" = "true" ]; then
              echo "→ wiping demo database"
              rm -f data/demo.db data/demo.db-*
              pm2 restart llm-lens-api-prod
            fi
            echo "→ waiting for demo account with data..."
            TOKEN=""
            for i in $(seq 1 60); do
              # log in only until we have a token - login is rate limited (10/min)
              [ -n "$TOKEN" ] || TOKEN=$(curl -sf -X POST http://localhost:3032/api/auth/login \
                -H 'content-type: application/json' \
                -d '{"email":"demo@llmlens.dev","password":"demo1234"}' \
                | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' || true)
              if [ -n "$TOKEN" ]; then
                TOTAL=$(curl -sf "http://localhost:3032/api/traces?limit=1" -H "authorization: Bearer $TOKEN" \
                  | sed -n 's/.*"total":\([0-9]*\).*/\1/p' || true)
                if [ "${TOTAL:-0}" -ge 10 ]; then echo "✓ demo ready: $TOTAL traces"; exit 0; fi
              fi
              sleep 5
            done
            echo "✗ demo account still has no data after 5 minutes"
            pm2 logs llm-lens-api-prod --lines 50 --nostream || true
            exit 1
          ENDSSH

      - name: Summary
        run: |
          echo "### Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- Seeded: ${{ inputs.seed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
