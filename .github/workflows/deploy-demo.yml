name: Deploy Demo

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Re-seed demo database (wipes existing data)"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Mikrus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── build shared packages ─────────────────────────────────────────────
      - name: Build shared packages
        run: |
          pnpm --filter @llm-lens/types build
          pnpm --filter @llm-lens/parsers build
          pnpm --filter @llm-lens/instrument build

      # ── build API ──────────────────────────────────────────────────────
      - name: Build API
        run: pnpm --filter @llm-lens/api build

      # ── build Nuxt on CI (memory-heavy — server has only 1 GB) ───────────
      - name: Build web
        run: pnpm --filter @llm-lens/web build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.DEMO_NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_DEMO_MODE: "true"
          NODE_OPTIONS: "--max-old-space-size=6144"

      # ── set up SSH ────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEMO_SSH_KEY }}" > ~/.ssh/demo_key
          chmod 600 ~/.ssh/demo_key
          ssh-keyscan -p ${{ secrets.DEMO_SSH_PORT }} ${{ secrets.DEMO_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Define SSH alias
        run: |
          echo "SSH_CMD=ssh -i ~/.ssh/demo_key -p ${{ secrets.DEMO_SSH_PORT }} ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}" >> $GITHUB_ENV
          echo "RSYNC_SSH=ssh -i ~/.ssh/demo_key -p ${{ secrets.DEMO_SSH_PORT }}" >> $GITHUB_ENV

      # ── create .env files from secrets, at fixed paths OUTSIDE apps/packages ──
      # deploy.sh wipes and re-extracts apps/ + packages/ on every deploy (tar+scp
      # pattern shared with xposter/fudini), so a .env dropped directly at
      # apps/api/.env or apps/web/.env wouldn't survive the next deploy. These fixed
      # paths live at the deploy dir root instead; deploy.sh copies them into place
      # itself, after extraction.
      - name: Create .env files on server
        run: |
          cat > /tmp/api.env << EOF
          JWT_SECRET=${{ secrets.DEMO_JWT_SECRET }}
          DATABASE_URL=file:./demo.db
          PORT=3032
          API_URL=http://localhost:3032
          FRONTEND_URL=http://localhost:3031
          EOF

          printf 'PORT=3031\n' > /tmp/web.env

          rsync -az -e "$RSYNC_SSH" /tmp/api.env \
            ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}:/home/llm-lens/.env.llm-lens-api

          rsync -az -e "$RSYNC_SSH" /tmp/web.env \
            ${{ secrets.DEMO_SSH_USER }}@${{ secrets.DEMO_SSH_HOST }}:/home/llm-lens/.env.llm-lens-web

      # ── archive build ────────────────────────────────────────────────────
      - name: Archive build
        run: |
          tar czf repo.tar.gz \
            apps \
            packages \
            scripts \
            deploy.sh \
            ecosystem.config.cjs \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            .nvmrc

      - name: Upload archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          port: ${{ secrets.DEMO_SSH_PORT }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          source: "repo.tar.gz"
          target: "/home/llm-lens"

      # ── extract & run deploy.sh ────────────────────────────────────────
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          port: ${{ secrets.DEMO_SSH_PORT }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            DEPLOY_DIR=/home/llm-lens

            # Wyczyść stare apps/packages przed rozpakowaniem (tar nie usuwa
            # plików, których nie ma w nowym archiwum).
            rm -rf $DEPLOY_DIR/apps $DEPLOY_DIR/packages

            tar xzf $DEPLOY_DIR/repo.tar.gz -C $DEPLOY_DIR
            rm $DEPLOY_DIR/repo.tar.gz
            chmod +x $DEPLOY_DIR/deploy.sh
            cd $DEPLOY_DIR
            ./deploy.sh

      # ── optional: re-seed database ────────────────────────────────────────
      - name: Seed demo database
        if: ${{ inputs.seed == true }}
        run: |
          $SSH_CMD bash -s << 'ENDSSH'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/llm-lens
            echo "→ wiping and re-seeding demo database"
            rm -f apps/api/demo.db
            pm2 restart llm-lens-api-prod
            echo "→ waiting for API..."
            for i in $(seq 1 20); do
              curl -sf http://localhost:3032/health && break
              sleep 2
            done
            API_URL=http://localhost:3032 npx tsx scripts/seed-demo.ts
          ENDSSH

      - name: Summary
        run: |
          echo "### Deploy complete" >> $GITHUB_STEP_SUMMARY
          echo "- Seeded: ${{ inputs.seed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
